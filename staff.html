<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - AZoom</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Logo">
            <span>AZoom Staff</span>
        </div>
        <nav>
            <ul>    
                <li><a href="staff.html">Dashboard</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
        <button id="themeToggle" class="theme-btn" aria-label="Toggle dark mode">⏾</button>
    </header>

    <main class="booking-main">
        <div class="booking-container" style="max-width: 1000px;">
            <h1 class="booking-title">Staff Workflow Dashboard</h1>
            <p style="text-align: center; margin-bottom: 20px;">Manage reservations, inspect cars, and generate final bills.</p>

            <div id="staffDashboard" class="staff-dashboard">
                <!-- JavaScript will inject the car cards into this div -->
            </div>
        </div>
    </main>

    <footer>
        <div class="copyright">
            <p>&copy; 2026 AZoom Car Rental. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
